# Option C — no reverse proxy yet (or you already run Caddy).
# Caddy becomes the single entry point on 80/443 and gets HTTPS certificates automatically.
# If Caddy already runs, skip the `caddy` service: join its network and add the
# otorithm.com blocks from caddy/Caddyfile to your existing Caddyfile.
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  otorithm-web:
    image: ghcr.io/YOUR_GITHUB_USER/otorithm-web:latest   # or replace with `build: ..`
    container_name: otorithm-web
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    name: edge

volumes:
  caddy_data:
  caddy_config:
