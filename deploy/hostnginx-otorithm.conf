# /etc/nginx/sites-available/otorithm.com  (Option D)
# Then: sudo ln -s /etc/nginx/sites-available/otorithm.com /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d otorithm.com -d www.otorithm.com --redirect

# www -> apex, so search engines see one site (certbot adds the HTTPS version of this block too)
server {
    listen 80;
    listen [::]:80;
    server_name www.otorithm.com;
    return 301 https://otorithm.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name otorithm.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
