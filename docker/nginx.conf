# Site server inside the otorithm-web container (nginx:alpine). HTTPS and the www -> apex redirect
# live in the reverse proxy in front of it (see deploy/).

# Markdown twins (/about.md, /index.md): tell search engines the HTML page is the canonical URL
map $uri $md_canonical {
    default                "";
    ~^/index\.md$          "https://otorithm.com/";
    ~^(?<mdpage>/.+)\.md$  "https://otorithm.com$mdpage.html";
}

# One URL per page: /services and /services/ redirect to /services.html, the canonical form
map $uri $html_target {
    default              "";
    ~^(?<page>/.+?)/?$   "$page.html";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;          # redirects keep the scheme and host the visitor used (behind the proxy)
    charset utf-8;
    charset_types text/css application/javascript text/plain text/markdown text/xml application/xml
                  application/rss+xml application/json application/manifest+json image/svg+xml;

    # Security headers. Every location that adds its own headers must include this file again,
    # because nginx drops inherited add_header lines in a block that sets any of its own.
    include /etc/nginx/snippets/otorithm-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml text/plain text/markdown text/xml
               application/xml application/rss+xml application/json application/manifest+json image/x-icon;

    # /index.html -> /
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /$1;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri @page;
    }

    location @page {
        if (-f $document_root$html_target) {
            return 301 $html_target$is_args$args;
        }
        return 404;
    }

    # Assets are versioned with ?v=<hash> by build.py, so they can be cached for a long time
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages and the files crawlers read (robots.txt, llms.txt, sitemap.xml, feeds) always revalidate,
    # so a deploy shows up immediately
    location ~* \.(?:html|txt|xml|json)$ {
        expires -1;
        try_files $uri @page;
    }

    # Markdown twins of each page, for AI assistants and LLM crawlers
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        expires -1;
        include /etc/nginx/snippets/otorithm-headers.conf;
        add_header Link "<$md_canonical>; rel=\"canonical\"" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
