server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server level only; an add_header inside a location would drop these)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # /services/legacy-modernization and /services/legacy-modernization.html both work
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets are versioned with ?v=<hash> by build.py, so they can be cached for a long time
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages always revalidate, so a deploy shows up immediately
    location ~* \.html$ {
        expires -1;
    }

    error_page 404 /404.html;
}
