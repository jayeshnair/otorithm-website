server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (kept at server level; no add_header inside locations,
    # which would silently drop these)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's content-hashed files: cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the entry page so deploys show up immediately
    location = /index.html {
        expires -1;
    }
}
