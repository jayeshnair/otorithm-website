# Response headers for every otorithm.com response (included by nginx.conf)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
# Honoured by browsers only over HTTPS, which the reverse proxy provides
add_header Strict-Transport-Security "max-age=31536000" always;
